[package]
name = "lightway-cffi"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "C ABI shim over lightway-core (Rust) for C/C++ consumers (e.g. kp_pkf_client)."
license = "AGPL-3.0-only"
repository = "https://github.com/expressvpn/lightway-cffi"

[workspace]
members = ["lightway-expresslane", "lightway-expresslane-cffi"]
# Deliberately NOT a member. Cargo resolves the whole workspace even for the
# `cargo rustc -p <pkg>` builds lightway-cffi.cmd runs, so a bench-only
# dependency the build machine cannot fetch would fail the *shipping* build —
# right after `cargo clean` has wiped the artifacts. It would also add `ring`
# and friends to this Cargo.lock (which the MSRV `--locked` job consumes) and
# CI's four `--workspace` jobs would build, test and clippy it. The bench is its
# own workspace root with its own lock and its own target dir.
exclude = ["lightway-expresslane-bench"]

[workspace.package]
# lightway-core uses Duration::from_mins, stabilized in Rust 1.91.
rust-version = "1.91"

[lib]
# cdylib: lightway_cffi.dll + import lib for dynamic linking
# staticlib: lightway_cffi.lib for fully-static embedding
# rlib: allow use as a Rust dep for tests / downstream Rust consumers
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
bytes = "1.6.0"
lightway-core = { git = "https://github.com/expressvpn/lightway", rev = "cc47e97290499239ed34244e20e058e7373aff4e", features = ["postquantum"] }

[build-dependencies]
cbindgen = "0.29"
