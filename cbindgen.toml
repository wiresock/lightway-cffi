# cbindgen configuration for lightway-cffi.
#
# The emitted header is consumed by C/C++ code that currently links against
# the OSS `expressvpn/lightway-core` C library. We deliberately mirror that
# project's `he_` / `HE_` naming so consumers (starting with kp_pkf_client)
# can swap include-path + link-lib without source churn.

language = "C"
pragma_once = true
include_guard = "XV_LIGHTWAY_CFFI_H"
tab_width = 4
documentation = true
documentation_style = "c"
style = "type"
cpp_compat = true
no_includes = false
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]

header = """
/*
 * lightway-cffi: C ABI for lightway-core (Rust).
 *
 * This header is auto-generated by cbindgen. DO NOT EDIT BY HAND.
 *
 * Naming convention (`he_*` / `HE_*`) intentionally mirrors the OSS
 * `expressvpn/lightway-core` C library to keep consumers source-compatible.
 */
"""

after_includes = """
/* he_packet_filter_t and he_domain_filter_t are defined in the C
 * threat-manager library. Include it here so those types are in scope
 * before the function declarations below reference them.
 * The relative path matches the layout used by kp_pkf_client. */
#ifndef XV_LIGHTWAY_CFFI_NO_PACKET_FILTER_INCLUDE
#include "../common/threat-manager/packet_filter.h"
#endif
"""

trailer = """
/* Source-compatibility alias: OSS he.h typedef'd the enum tag as both
 * `he_connection_type` and `he_connection_type_t`. Provide the untagged
 * alias so existing structs using `he_connection_type` as a type still compile.
 * Must appear AFTER he_connection_type_t is defined above. */
typedef he_connection_type_t he_connection_type;
"""

[export]
prefix = ""
include = [
    # Not referenced in any extern "C" fn signature but needed by consumers
    # (e.g. helium_config_parser.h uses he_padding_type_t in struct fields).
    "he_padding_type_t",
]
exclude = [
    # he_packet_filter_t / he_domain_filter_t and their enums are defined by the
    # C threat-manager library (packet_filter.h), not by this crate. They are
    # listed here defensively so that even if such a type is reintroduced on the
    # Rust side it is never emitted and cannot conflict with the C definitions.
    "he_packet_filter_t",
    "he_domain_filter_t",
    "he_domain_filter_blocking_mode_t",
    "he_packet_filter_decision_t",
]

[export.rename]

[enum]
prefix_with_name = false
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
