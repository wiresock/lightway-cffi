[package]
name = "lightway-expresslane"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Pure-Rust ExpressLane data-packet encrypt/decrypt primitives, independent of lightway-core."
license = "AGPL-3.0-only"
repository = "https://github.com/expressvpn/lightway-cffi"

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[dependencies]
# ring's fused AES-GCM assembly (AES-NI + PCLMULQDQ) replaces RustCrypto
# aes-gcm: 1.00 c/B vs 3.11 c/B on the E-2286G rig, byte-identical on the wire
# (the golden vectors in tests/wire_vectors.rs are the proof). Pinned to the
# exact patch the benchmark measured, since the MSRV CI job builds `--locked`.
# `default-features = false` drops `alloc` and `dev_urandom_fallback`; this
# crate uses only the detached seal/open entry points, which need neither.
ring = { version = "0.17.14", default-features = false }
