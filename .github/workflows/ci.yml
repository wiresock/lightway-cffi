name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin the Windows image to windows-2022 (Visual Studio 2022). The pinned
        # wolfssl-sys 4.1.0 build script searches specifically for "MsBuild 2022"
        # and fails on the windows-latest image, which GitHub redirected to a
        # Visual Studio 2026 runner on 2026-06-15. Revisit once wolfssl-sys
        # (pulled transitively via lightway-core) supports newer MSBuild.
        os: [ubuntu-latest, windows-2022]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (all crate types)
        run: cargo build --release

      - name: Run tests
        run: cargo test

  check-header:
    name: Header up-to-date check (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ubuntu-cargo-

      - name: Build (regenerates include/lightway_cffi.h)
        run: cargo build

      - name: Verify header is unchanged
        run: |
          git diff --exit-code include/lightway_cffi.h || \
            (echo "::error::include/lightway_cffi.h is out of date. Run 'cargo build' and commit the result." && exit 1)

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ubuntu-cargo-clippy-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ubuntu-cargo-

      - name: Run Clippy
        run: cargo clippy -- -D warnings
